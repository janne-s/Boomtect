<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boomtect</title>
    <meta name="description" content="Physical acoustics laboratory for thunder and blasts: synthetic sources, height, ground, and air, rendered to sound." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/solid.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="bar">
      <span class="brand">Boomtect</span>
      <div class="modes" role="radiogroup" aria-label="Mode">
        <button type="button" role="radio" data-mode="thunder" aria-checked="true">Thunder</button>
        <button type="button" role="radio" data-mode="blast" aria-checked="false">Blast</button>
        <button type="button" role="radio" data-mode="sonic" aria-checked="false">Sonic</button>
      </div>
      <button type="button" id="play" class="primary" disabled aria-pressed="false">Play</button>
      <div class="icon-toggles" role="group" aria-label="Rendering and playback">
        <button type="button" class="icon-toggle" id="auto-render" aria-pressed="true" aria-label="Auto render" title="Auto render"><i class="fa-solid fa-repeat" aria-hidden="true"></i></button>
        <button type="button" class="icon-toggle" id="real-delay" aria-pressed="true" aria-label="Real delay" title="Real delay"><i class="fa-solid fa-hourglass-half" aria-hidden="true"></i></button>
      </div>
      <span id="listen-label" class="listen-label"></span>
      <span class="spacer"></span>
      <button type="button" id="open">Open</button>
      <button type="button" id="save">Save</button>
      <button type="button" id="export" disabled>Export</button>
      <input type="file" id="open-file" accept="application/json,.json" hidden />
    </header>

    <main class="layout">
      <figure class="view" aria-label="Scene">
        <canvas id="cube" aria-label="Scene"></canvas>
        <div class="overlay overlay-top" id="cube-selected"></div>
        <div class="view-side">
          <div class="icon-toggles view-tools" role="toolbar" aria-label="View" aria-orientation="vertical">
            <button type="button" class="icon-toggle" id="wavefront" aria-pressed="false" aria-label="Wavefronts" title="Wavefronts"><i class="fa-solid fa-bullseye" aria-hidden="true"></i></button>
            <button type="button" class="icon-toggle" id="cone" aria-pressed="false" aria-label="Mach cone" title="Mach cone" hidden><i class="fa-solid fa-jet-fighter" aria-hidden="true"></i></button>
            <button type="button" class="icon-toggle" id="clouds" aria-pressed="false" aria-label="Cloud" title="Cloud" hidden><i class="fa-solid fa-cloud" aria-hidden="true"></i></button>
            <button type="button" class="icon-toggle" id="names" aria-pressed="false" aria-label="Place names" title="Place names" hidden><i class="fa-solid fa-tag" aria-hidden="true"></i></button>
            <button type="button" class="icon-toggle" id="map" aria-pressed="false" aria-label="Map" title="Map" hidden><i class="fa-solid fa-map" aria-hidden="true"></i></button>
          </div>
          <div class="attribution" id="cube-attribution" hidden>
            <button type="button" class="info-button" id="attribution-button" aria-expanded="false" aria-controls="attribution-text" title="Data sources">i</button>
            <div class="attribution-text" id="attribution-text" hidden>
              <a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md" target="_blank" rel="noopener">Terrain Tiles: Mapzen / AWS Open Data</a> (SRTM, GMTED2010, NED, ETOPO1, EU-DEM, national datasets)<br />
              Place names and search: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors<br />
              Map: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, SRTM; style © <a href="https://opentopomap.org/" target="_blank" rel="noopener">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA</a>)
            </div>
          </div>
        </div>
        <div class="overlay overlay-corner">
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <ul class="operations" id="cube-operations" aria-live="polite"></ul>
          <div class="overlay-timeline" id="cube-timeline" hidden>
            <span id="cube-timeline-time"></span>
            <div class="timeline-bar"><div class="timeline-arrival" id="cube-timeline-arrival"></div><div class="timeline-progress" id="cube-timeline-progress"></div></div>
          </div>
        </div>
        <div class="overlay overlay-bottom">
          <div class="cube-orientation" id="cube-orientation" hidden>
            <canvas id="cube-orientation-ball" aria-label="Orientation"></canvas>
            <span><strong id="cube-orientation-name"></strong> <span id="cube-orientation-value"></span></span>
          </div>
          <div class="overlay-stack" id="cube-listen"></div>
        </div>
      </figure>
      <div class="splitter splitter-column" id="split-column" role="separator" aria-orientation="vertical" aria-label="Resize parameters" tabindex="0"></div>
      <aside class="panel" aria-label="Parameters">
        <section>
          <h2>Emitters</h2>
          <div class="row-buttons add-row">
            <button type="button" id="add-lightning" data-mode="thunder">+ Ground flash</button>
            <button type="button" id="add-cloud" data-mode="thunder">+ Cloud flash</button>
            <button type="button" id="add-storm" data-mode="thunder">+ Storm</button>
            <button type="button" id="add-blast" data-mode="blast">+ Blast</button>
            <button type="button" id="add-barrage" data-mode="blast">+ Barrage</button>
            <button type="button" id="add-flight" data-mode="sonic">+ Flight</button>
            <button type="button" id="add-formation" data-mode="sonic">+ Formation</button>
            <button type="button" id="add-meteor" data-mode="sonic">+ Meteor</button>
            <button type="button" id="add-shower" data-mode="sonic">+ Shower</button>
          </div>
          <div class="list" id="emitter-list"></div>
        </section>
        <section>
          <h2>Receivers</h2>
          <div class="row-buttons">
            <button type="button" id="add-receiver">+ Mic</button>
          </div>
          <div class="list" id="receiver-list"></div>
        </section>
        <details class="group">
          <summary>Air and ground</summary>
          <div class="fields" id="environment-fields"></div>
        </details>
        <details class="group">
          <summary>Terrain</summary>
          <div class="fields" id="terrain-fields"></div>
        </details>
        <details class="group">
          <summary>Output</summary>
          <div class="fields" id="output-fields"></div>
        </details>
      </aside>

      <div class="splitter splitter-row" id="split-row" role="separator" aria-orientation="horizontal" aria-label="Resize results" tabindex="0"></div>
      <section class="results" id="results" aria-label="Result">
        <figure class="plot plot-wave">
          <canvas id="waveform" aria-label="Pressure waveform"></canvas>
          <figcaption><button type="button" class="plot-play" id="plot-play" aria-label="Play" disabled><svg viewBox="0 0 10 10" aria-hidden="true"><path class="icon-play" d="M2 1 9 5 2 9Z"/><path class="icon-pause" d="M2 1h2v8H2zM6 1h2v8H6z"/></svg></button>Pressure <span class="plot-tabs" id="plot-tabs" role="group" aria-label="Solo microphone"></span></figcaption>
        </figure>
        <figure class="plot plot-arrivals">
          <canvas id="arrivals" aria-label="Arrival time by source height"></canvas>
          <figcaption id="arrivals-caption">Arrival · height</figcaption>
        </figure>
      </section>
    </main>

    <dialog id="place-dialog" class="place-dialog" aria-label="Place" tabindex="-1">
      <header class="details-header">
        <form class="place-search" id="place-search">
          <input type="text" id="place-query" maxlength="120" aria-label="Place" />
          <button type="submit">Find</button>
        </form>
        <span class="place-coordinates" id="place-coordinates"></span>
        <button type="button" id="place-cancel">Cancel</button>
        <button type="button" id="place-done" class="primary">Load</button>
      </header>
      <div class="place-map">
        <canvas id="place-map" aria-hidden="true"></canvas>
        <canvas id="place-overlay" aria-label="Map"></canvas>
        <span class="place-credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></span>
      </div>
    </dialog>

    <dialog id="export-dialog" class="export-dialog" aria-labelledby="export-title" tabindex="-1">
      <form id="export-form" method="dialog">
        <header class="details-header">
          <h2 id="export-title">Export</h2>
          <button type="button" id="export-all">Select all</button>
        </header>
        <div class="export-body">
          <label class="export-name"><span>Name</span><input type="text" id="export-name" maxlength="80" required /></label>
          <div class="export-list" id="export-list"></div>
          <p class="export-contract" id="export-contract"></p>
          <p class="export-summary" id="export-summary"></p>
          <p class="export-error" id="export-error" role="alert" hidden></p>
        </div>
        <footer class="export-actions">
          <button type="submit" value="cancel">Cancel</button>
          <button type="submit" id="export-submit" class="primary" value="export">Export</button>
        </footer>
      </form>
    </dialog>
    <dialog id="details" aria-labelledby="details-title" tabindex="-1">
      <header class="details-header">
        <h2 id="details-title"></h2>
        <span class="legend"><b>A</b> first principles · <b>B</b> literature · <b>C</b> heuristic or synthetic</span>
        <button type="button" id="details-close" class="primary">Done</button>
      </header>
      <div class="details-body" id="details-body"></div>
    </dialog>
  </body>
</html>
