<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boomtect</title>
    <meta name="description" content="Physical acoustics laboratory for thunder and blasts: synthetic sources, height, ground, and air, rendered to sound." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="bar">
      <span class="brand">Boomtect</span>
      <div class="modes" role="radiogroup" aria-label="Mode">
        <button type="button" role="radio" data-mode="thunder" aria-checked="true">Thunder</button>
        <button type="button" role="radio" data-mode="blast" aria-checked="false">Blast</button>
      </div>
      <button type="button" id="play" class="primary" disabled aria-pressed="false">Play</button>
      <label class="toggle" title="Off: skip the silence before the first sound"><input type="checkbox" id="real-delay" checked /> Real delay</label>
      <label class="toggle"><input type="checkbox" id="wavefront" /> Wavefront</label>
      <span id="listen-label" class="listen-label"></span>
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <button type="button" id="open">Open</button>
      <button type="button" id="save">Save</button>
      <button type="button" id="export" disabled>Export WAV</button>
      <input type="file" id="open-file" accept="application/json,.json" hidden />
    </header>

    <main class="layout">
      <figure class="view" aria-label="Scene">
        <canvas id="cube" aria-label="Scene"></canvas>
        <div class="overlay overlay-top" id="cube-selected"></div>
        <div class="overlay overlay-bottom">
          <div class="cube-orientation" id="cube-orientation" hidden>
            <canvas id="cube-orientation-ball" aria-label="Orientation"></canvas>
            <span><strong id="cube-orientation-name"></strong> <span id="cube-orientation-value"></span></span>
          </div>
          <div class="overlay-stack" id="cube-listen"></div>
        </div>
      </figure>
      <div class="splitter splitter-column" id="split-column" role="separator" aria-orientation="vertical" aria-label="Resize parameters" tabindex="0"></div>
      <aside class="panel" aria-label="Parameters">
        <section>
          <h2>Emitters</h2>
          <div class="row-buttons add-row">
            <button type="button" id="add-lightning" data-mode="thunder">+ Ground flash</button>
            <button type="button" id="add-cloud" data-mode="thunder">+ Cloud flash</button>
            <button type="button" id="add-storm" data-mode="thunder">+ Storm</button>
            <button type="button" id="add-blast" data-mode="blast">+ Blast</button>
          </div>
          <div class="list" id="emitter-list"></div>
        </section>
        <section>
          <h2>Receivers</h2>
          <div class="row-buttons">
            <button type="button" id="add-receiver">+ Mic</button>
          </div>
          <div class="list" id="receiver-list"></div>
        </section>
        <details class="group">
          <summary>Air and ground</summary>
          <div class="fields" id="environment-fields"></div>
        </details>
        <details class="group">
          <summary>Output</summary>
          <div class="fields" id="output-fields"></div>
        </details>
      </aside>

      <div class="splitter splitter-row" id="split-row" role="separator" aria-orientation="horizontal" aria-label="Resize results" tabindex="0"></div>
      <section class="results" aria-label="Result">
        <figure class="plot plot-wave">
          <canvas id="waveform" aria-label="Pressure waveform"></canvas>
          <figcaption>Pressure <span class="plot-tabs" id="plot-tabs" role="group" aria-label="Solo microphone"></span></figcaption>
        </figure>
        <figure class="plot plot-arrivals">
          <canvas id="arrivals" aria-label="Arrival time by source height"></canvas>
          <figcaption>Arrival · height</figcaption>
        </figure>
      </section>
    </main>

    <dialog id="details" aria-labelledby="details-title" tabindex="-1">
      <header class="details-header">
        <h2 id="details-title"></h2>
        <span class="legend"><b>A</b> first principles · <b>B</b> literature · <b>C</b> heuristic or synthetic</span>
        <button type="button" id="details-close" class="primary">Done</button>
      </header>
      <div class="details-body" id="details-body"></div>
    </dialog>
  </body>
</html>
